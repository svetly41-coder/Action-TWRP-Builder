
name: VOCSTOR OS - TWRP Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'twrp-11'
      DEVICE_TREE_URL:
        description: 'Device Tree'
        required: true
        default: 'https://github.com/serzhbsv/android_device_realme_RMX3261'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-11'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/realme/RMX3261'
      COMMON_TREE_URL:
        description: 'Common Tree URL'
        required: false
      COMMON_PATH:
        description: 'Common Tree Path'
        required: false
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'RMX3261'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'twrp_RMX3261'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y \
            gperf gcc-multilib g++-multilib \
            libc6-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev build-essential \
            libgtk-3-dev libglu1-mesa-dev freeglut3-dev \
            git libxml2 lzop pngcrush schedtool \
            squashfs-tools imagemagick libbz2-dev \
            lzma ncftp qemu-user-static libstdc++-10-dev \
            python3 tar curl

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize source
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          repo init --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

      - name: Sync source
        run: |
          repo sync -j$(nproc --all) --force-sync
        working-directory: workspace

      - name: Clone device tree
        run: |
          mkdir -p "$(dirname '${{ github.event.inputs.DEVICE_PATH }}')"
          git clone \
            "${{ github.event.inputs.DEVICE_TREE_URL }}" \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_PATH }}"
        working-directory: workspace

      - name: Clone common tree
        if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
        run: |
          git clone \
            "${{ github.event.inputs.COMMON_TREE_URL }}" \
            "${{ github.event.inputs.COMMON_PATH }}"
        working-directory: workspace

      - name: Sync device dependencies
        run: |
          if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies" ]; then
            bash "${GITHUB_WORKSPACE}/scripts/convert.sh" \
              "${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies"
            repo sync -j$(nproc --all)
          fi
        working-directory: workspace
        continue-on-error: true

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build TWRP
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "${{ github.event.inputs.MAKEFILE_NAME }}-eng"
          make clean
          make "${{ github.event.inputs.BUILD_TARGET }}image" -j$(nproc --all)
        working-directory: workspace

      - name: Upload Recovery
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          name: VOCSTOR-TWRP-${{ github.run_id }}
          tag_name: vocstor-${{ github.run_id }}
          body: |
            VOCSTOR OS Recovery Build
            Device: RMX3261
            Manifest: twrp-11
            Device Tree: android-11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
